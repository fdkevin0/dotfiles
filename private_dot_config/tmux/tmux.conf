set -g @plugin 'tmux-plugins/tpm'
#set -g @plugin 'tmux-plugins/tmux-resurrect'
#set -g @plugin 'tmux-plugins/tmux-continuum'
#set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# set shell
set -g default-shell /usr/bin/fish

# Keep enough history for agent logs and long conversations
set -g history-limit 50000

# Better interaction defaults
set -g mouse on
set -g renumber-windows on
set -g default-terminal "tmux-256color"
set -g status-interval 5
set -sg escape-time 10
setw -g automatic-rename on

# Make layouts easier to manage during agent work
setw -g aggressive-resize on

# Clipboard, passthrough, and environment
set -s set-clipboard on
set -g allow-passthrough on
set -ga update-environment TERM_PROGRAM
set -g focus-events on

# Extended keys (CSI u) and terminal capabilities for Ghostty + agy
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys:clipboard:RGB:hyperlinks:sync:usstyle'

# Keep current working directory when creating windows or splitting panes
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
